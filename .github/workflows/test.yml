name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: modernization-index
            tests: mi-research/tests
          - project: collectivization
            tests: collectivization/tests
          - project: fragmentation
            tests: fragmentation/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q -p no:cacheprovider "${{ matrix.tests }}"

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mi-website/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mi-website/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  data-pipeline:
    name: Data pipeline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mi-pipeline/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r mi-pipeline/requirements.txt
      - name: Run smoke test
        working-directory: mi-pipeline
        run: python test_smoke.py
