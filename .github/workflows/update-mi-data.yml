name: Update MI dataset

# Refresh source data, rebuild the public dataset, and commit changed output.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

concurrency:
  group: update-mi-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh, score, and publish
        run: python mi-website/scripts/refresh_and_build.py
      - name: Commit regenerated dataset if changed
        run: |
          git config user.name "mi-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- mi-website/web/public/data; then
            git add mi-website/web/public/data
            git commit -m "data: scheduled MI dataset refresh"
            git push
          else
            echo "No dataset changes."
          fi
